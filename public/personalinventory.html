<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Personal Inventory</title><link rel="icon" href="/assets/apps/inventory.png"><style>:root{color-scheme:dark;font-family:system-ui,sans-serif;--bg:#10171b;--panel:#182328;--line:#31505b;--text:#edf7fa;--muted:#9bb0b8;--cyan:#35d4f4;--green:#82edaa;--red:#ff9b9b}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#1b414b,#10171b 55%);color:var(--text)}main{max-width:1100px;margin:auto;padding:28px 18px}a{color:var(--cyan)}h1{font-size:clamp(2rem,6vw,4rem);margin:.4rem 0 1.2rem}.top{display:flex;justify-content:space-between;gap:16px;align-items:start}.nav{display:flex;gap:8px;flex-wrap:wrap}button,input,select{font:inherit;border:1px solid var(--line);border-radius:9px;padding:10px 12px;background:#10181c;color:var(--text)}button{cursor:pointer;background:#15566b;border-color:#26a9c8}.panel{padding:20px;margin:18px 0;border:1px solid var(--line);border-radius:16px;background:#182328dd}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.stat{padding:14px;border:1px solid var(--line);border-radius:10px}.stat strong{display:block;font-size:1.7rem;color:var(--green)}.toolbar,.add-grid{display:grid;grid-template-columns:2fr 1fr 1fr auto;gap:10px}.inventory{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}.card{padding:16px;border:1px solid var(--line);border-radius:12px;background:#121b1f}.meta{color:var(--muted);font-size:.9rem}.qty{display:flex;align-items:center;gap:8px;margin:14px 0}.qty input{width:76px;text-align:center}.remove{background:transparent;border-color:#8e4c56;color:#ffb4b4}.message{padding:12px;border:1px solid #8e4c56;color:#ffc1c1}.empty,.loading{color:var(--muted)}.catalog-results{display:grid;gap:8px;margin-top:12px}.catalog-item{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px;border:1px solid var(--line);border-radius:9px}.catalog-item.selected{border-color:var(--cyan)}@media(max-width:700px){.top,.toolbar,.add-grid{grid-template-columns:1fr;display:grid}.nav{justify-content:start}.summary{grid-template-columns:1fr}.toolbar button{width:100%}}</style></head><body><main><div class="top"><div><a href="/">← Blueprint Inventory</a><h1>Personal Inventory</h1></div><nav class="nav"><a href="/groups">Groups</a><form method="post" action="/logout"><button>Log out</button></form></nav></div><section class="panel summary"><div class="stat">UNIQUE ITEMS<strong id="unique">0</strong></div><div class="stat">TOTAL ITEMS<strong id="total">0</strong></div><div class="stat">LOCATIONS<strong id="locations">0</strong></div></section><section class="panel"><div id="message" class="message" hidden></div><div class="toolbar"><input id="search" placeholder="Search inventory…"><select id="location"><option value="">All locations</option></select><select id="category"><option value="">All categories</option></select><button id="add">＋ Add item</button></div><div id="addPanel" hidden><div class="add-grid"><input id="catalogSearch" placeholder="Search catalog…"><select id="addLocation"></select><input id="addQuantity" type="number" min="1" value="1"><button id="confirmAdd">Add selected</button></div><div id="catalogResults" class="catalog-results"></div></div></section><section class="panel"><h2>My Inventory</h2><div id="state" class="loading">LOADING PERSONAL INVENTORY…</div><div id="inventory" class="inventory"></div></section></main><script type="module" src="/js/personalinventory-classic.js"></script></body></html>
