<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="/assets/apps/orders.png"><title>Materialaufträge · Blueprint Inventory</title><style>:root{--bg:#0d1216;--panel:#171f24;--line:#31505b;--text:#e8f0f3;--muted:#91a6ae;--cyan:#2bd4f2;--green:#7bedaa;--red:#f07b7b}*{box-sizing:border-box}body{margin:0;padding:28px;background:radial-gradient(circle at 20% 0,#18333c,#0d1216 55%);color:var(--text);font:16px system-ui,-apple-system,Segoe UI,sans-serif}main{max-width:1120px;margin:auto}a{color:var(--cyan)}h1{font-size:clamp(2rem,5vw,4rem);margin:0}.orders-brand{display:flex;align-items:center;gap:18px;margin:.5rem 0 1.5rem}.orders-logo{display:block;width:88px;height:88px;object-fit:contain;flex:0 0 88px}.panel{padding:22px;margin:18px 0;border:1px solid var(--line);border-radius:16px;background:linear-gradient(145deg,#1b252b,#12191d);box-shadow:0 16px 40px #0005}.form{display:grid;grid-template-columns:2fr 1fr 1fr;gap:14px}.field{display:flex;flex-direction:column;gap:6px}.field.full{grid-column:1/-1}.field label,.eyebrow{font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}input,select,textarea,button{padding:12px 14px;border-radius:9px;border:1px solid var(--line);background:#10171b;color:var(--text);font:inherit}input,select,textarea{width:100%}button{background:#15566b;border-color:#22a8c8;cursor:pointer}button:hover,button:focus-visible{background:#1e7187;outline:2px solid #8aeaff;outline-offset:2px}.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:18px}.filter{background:#10171b;color:var(--muted)}.filter.active{background:#176076;color:#fff}.orders{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px}.order{padding:20px;border:1px solid var(--line);border-radius:14px;background:var(--panel);display:flex;flex-direction:column;gap:13px;min-width:0}.order.completed{opacity:.7}.order-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.material{font-size:1.35rem;font-weight:700;word-break:break-word}.status{padding:5px 9px;border-radius:999px;font-size:.7rem;letter-spacing:.08em;font-weight:700;white-space:nowrap}.status.open{color:#f0b44c;border:1px solid #a87825}.status.claimed,.status.reported{color:var(--cyan);border:1px solid #1c9db9}.status.completed{color:var(--green);border:1px solid #3c9d67}.status.cancelled{color:var(--red);border:1px solid #a14949}.meta{color:var(--muted);font-size:.9rem}.scmdb{font-size:.8rem;text-transform:uppercase;letter-spacing:.1em;white-space:nowrap}.required{font-size:1.7rem;font-weight:700}.progress{height:10px;background:#0b1114;border-radius:999px;overflow:hidden;border:1px solid #29404a}.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--cyan),var(--green));border-radius:inherit}.numbers{display:flex;justify-content:space-between;color:var(--muted);font-size:.85rem}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto}.actions button{font-size:.9rem}.secondary{background:transparent;border-color:#49606a;color:var(--muted)}.muted{color:var(--muted)}.error{color:#ffb9c0;border:1px solid #84535b;padding:12px;margin-bottom:14px}@media(max-width:720px){body{padding:16px}.orders-brand{gap:12px}.orders-logo{width:64px;height:64px;flex-basis:64px}.form{grid-template-columns:1fr}.field.full{grid-column:auto}.orders{grid-template-columns:1fr}.actions button{flex:1 1 100%}}</style></head><body><main><a href="/">← Inventar</a><div class="orders-brand"><img class="orders-logo" src="/assets/apps/orders.png" alt="Orders"><h1>Materialaufträge</h1></div><section class="panel"><div class="toolbar"><h2 style="margin-right:auto">Orders</h2><label>CREW / GRUPPE<select id="group" required></select></label><button id="toggleForm" type="button">＋ Neuer Auftrag</button></div><p id="message" class="error" hidden></p><form id="create" class="form" hidden><div class="field"><label>Material<select name="material_name" required></select></label></div><div class="field"><label>Menge<input name="required_quantity" type="number" min="0.01" step="0.01" required></label></div><div class="field"><label>Einheit<select name="quantity_unit"><option>SCU</option><option>qty</option></select></label></div><div class="field"><label>Required Quality<input name="required_quality"></label></div><div class="field full"><label>Note<textarea name="note" rows="2"></textarea></label></div><button type="submit">Auftrag erstellen</button></form></section><section class="panel"><div class="toolbar"><strong id="count">0 Aufträge</strong><input id="search" placeholder="Material suchen…" style="max-width:260px"><div id="filters"><button class="filter active" data-filter="all">Alle</button><button class="filter" data-filter="open">Offen</button><button class="filter" data-filter="claimed">Übernommen</button><button class="filter" data-filter="reported">In Arbeit</button><button class="filter" data-filter="completed">Erledigt</button><button class="filter" data-filter="cancelled">Abgebrochen</button></div></div><div id="orders" class="orders"></div></section></main><script type="module">
import{createOrder,filterOrders,loadGroups,loadOrders,materials,normalizeStatus,performOrderAction,progressFor,scmdbUrl}from'/js/orders-core.js';
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),label=s=>({open:'OPEN',claimed:'CLAIMED',reported:'IN PROGRESS',completed:'COMPLETED',cancelled:'CANCELLED'}[s]||String(s).toUpperCase()),group=document.querySelector('#group'),orders=document.querySelector('#orders'),msg=document.querySelector('#message'),form=document.querySelector('#create'),search=document.querySelector('#search'),count=document.querySelector('#count');let groups=[],allOrders=[],activeFilter='all';
function render(){const visible=filterOrders(allOrders,{status:activeFilter,query:search.value});count.textContent=allOrders.length+' Aufträge';orders.innerHTML=visible.map(o=>{const s=normalizeStatus(o),p=progressFor(o);return '<article class="order '+esc(s)+'"><div class="order-head"><div><div class="eyebrow">Materialauftrag</div><div class="material">'+esc(o.material_name)+'</div></div><span class="status '+esc(s)+'">'+label(s)+'</span></div><a class="scmdb" target="_blank" rel="noreferrer" href="'+scmdbUrl(o.material_name)+'">SCMDB ↗</a><div class="eyebrow">Required</div><div class="required">'+p.required+' '+esc(o.quantity_unit)+'</div><div class="progress" role="progressbar" aria-valuenow="'+p.percentage+'"><i style="width:'+p.percentage+'%"></i></div><div class="numbers"><span>'+p.delivered+' '+esc(o.quantity_unit)+' beschafft</span><span>'+p.remaining+' '+esc(o.quantity_unit)+' offen</span><span>'+p.percentage+'%</span></div><div class="meta">Erstellt von <strong>'+esc(o.creator_name)+'</strong>'+(o.assignee_name?' · übernommen von <strong>'+esc(o.assignee_name)+'</strong>':'')+(o.required_quality?' · Required quality: '+esc(o.required_quality):'')+(o.delivered_quality?' · Delivered quality: '+esc(o.delivered_quality):'')+(o.note?' · '+esc(o.note):'')+'</div><div class="actions">'+(s==='open'?'<button data-action="claim" data-id="'+esc(o.id)+'">Auftrag übernehmen</button>':'')+((s==='claimed'||s==='reported')?'<button data-action="report" data-id="'+esc(o.id)+'">Beschaffung melden</button><button class="secondary" data-action="complete" data-id="'+esc(o.id)+'">Als erfüllt ✓</button><button class="secondary" data-action="cancel" data-id="'+esc(o.id)+'">Auftrag abbrechen</button>':'')+(s==='completed'?'<button class="secondary" data-action="hide" data-id="'+esc(o.id)+'">Aus Liste ausblenden</button>':'')+'</div></article>'}).join('')||'<p class="muted">Keine passenden Aufträge.</p>'}
async function load(){if(!group.value)return;try{allOrders=await loadOrders(group.value);msg.hidden=true;render()}catch(e){msg.textContent=e.message;msg.hidden=false}}async function init(){try{groups=await loadGroups();group.innerHTML=groups.map(g=>'<option value="'+esc(g.id)+'">'+esc(g.name)+'</option>').join('');if(groups[0])await load()}catch(e){msg.textContent=e.message;msg.hidden=false}}group.onchange=load;search.oninput=render;document.querySelector('#toggleForm').onclick=()=>{form.hidden=!form.hidden};document.querySelector('#filters').onclick=e=>{const b=e.target.closest('[data-filter]');if(!b)return;activeFilter=b.dataset.filter;document.querySelectorAll('.filter').forEach(x=>x.classList.toggle('active',x===b));render()};form.querySelector('[name="material_name"]').innerHTML='<option value="">Material wählen</option>'+materials.map(m=>'<option>'+m+'</option>').join('');form.onsubmit=async e=>{e.preventDefault();try{await createOrder({group_id:group.value,...Object.fromEntries(new FormData(form))});form.reset();form.hidden=true;await load()}catch(err){msg.textContent=err.message;msg.hidden=false}};orders.onclick=async e=>{const b=e.target.closest('[data-action]');if(!b)return;const action=b.dataset.action,data={id:b.dataset.id,action};if(action==='report'){const quantity=prompt('Beschaffte Menge:','0');if(quantity===null)return;data.delivered_quantity=quantity;data.delivered_quality=prompt('Qualitätsstufe:','')||''}try{await performOrderAction(data);await load()}catch(err){msg.textContent=err.message;msg.hidden=false}};init();</script></body></html>
