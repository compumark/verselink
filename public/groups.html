<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="/assets/apps/groups.png"><title>Gruppenverwaltung · Blueprint Inventory</title><style>:root{color-scheme:dark;font-family:system-ui;background:#101317;color:#eef4f7}body{margin:0;padding:30px;background:radial-gradient(circle at top right,#173e4a,#101317 45%)}main{max-width:980px;margin:auto}.panel{margin:18px 0;padding:22px;border:1px solid #33454d;border-radius:14px;background:#181e23}h1{margin:0}.groups-brand{display:flex;align-items:center;gap:16px;margin:12px 0 24px}.groups-logo{display:block;width:76px;height:76px;object-fit:contain;flex:0 0 76px}h2{margin-top:0}p{color:#b9c6cb;line-height:1.5}a{color:#72d9f6}input,select,button{padding:11px;border-radius:8px;border:1px solid #33454d;background:#11181c;color:#eef4f7;font:inherit}input{width:min(620px,100%);box-sizing:border-box}button{cursor:pointer;background:#16495a;border-color:#1e8cae;margin:6px 6px 0 0}.member{display:flex;justify-content:space-between;gap:16px;align-items:center;border-top:1px solid #2b3a40;padding:12px 0}.ok{color:#8df0b8}.stale{color:#ffb86b}.invite-list{margin:18px 0 4px;padding-top:12px;border-top:1px solid #33454d}.invite{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;margin:10px 0}.invite-code{width:100%;color:#72d9f6;font-family:ui-monospace,monospace}.muted{color:#8fa1a8;font-size:.9rem}.message{color:#8df0b8;min-height:1.4em}.error{color:#ffb0aa}.admin-user{display:flex;justify-content:space-between;gap:12px;border-top:1px solid #2b3a40;padding:10px 0}@media(max-width:700px){body{padding:16px}.groups-brand{gap:12px}.groups-logo{width:64px;height:64px;flex-basis:64px}.member,.admin-user{align-items:flex-start;flex-direction:column;gap:4px}.invite{grid-template-columns:1fr}.invite button{width:100%;margin-top:0}}</style></head><body><main><a href="/">← Inventar</a> · <a href="/orders">Materialaufträge</a><p id="greeting"></p><div class="groups-brand"><img class="groups-logo" src="/assets/apps/groups.png" alt="Groups"><h1>Gruppenverwaltung</h1></div><section class="panel"><h2>Neue Gruppe</h2><form id="create"><input name="name" placeholder="Gruppenname" required><button>Erstellen</button></form></section><section class="panel"><h2>Gruppe beitreten</h2><p>Füge einen Einladungscode ein.</p><form id="join"><input name="invite" placeholder="Einladungscode" required autocomplete="off"><button>Beitreten</button></form><p id="message" class="message"></p></section><section class="panel"><h2>Material-Synchronisierung</h2><button id="sync">Materialien jetzt synchronisieren</button><p id="syncMessage" class="message"></p></section><div id="groups">Lade Gruppen …</div><section class="panel"><h2>Offene Einladungen</h2><div id="invites">Lade Einladungen …</div></section><section class="panel" id="admin" hidden><h2>App-Administration</h2><div id="adminContent"></div></section><form method="post" action="/logout"><button>Abmelden</button></form></main><script type="module" src="/js/groups-classic.js"></script></body></html>
