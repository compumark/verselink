<script>(()=>{const content=document.querySelector('#content'),body=document.body;let materialReady=false,loadingMaterial=false;const installMaterialIcon=()=>document.querySelectorAll('.app[data-app="material"]').forEach(card=>{if(card.querySelector('.app-icon'))return;const icon=document.createElement('i');icon.className='app-icon';icon.style.webkitMaskImage="url('/assets/icons/material-crate.svg')";icon.style.maskImage="url('/assets/icons/material-crate.svg')";card.prepend(icon)});const loadMaterial=()=>{if(location.hash!=='#material'||loadingMaterial||materialReady)return;loadingMaterial=true;import('/js/material-inventory-mobiglass.js').then(module=>module.mount()).then(()=>{materialReady=true}).finally(()=>{loadingMaterial=false;body.classList.remove('session-pending')})};new MutationObserver(installMaterialIcon).observe(content,{childList:true,subtree:true});new MutationObserver(()=>{if(location.hash==='#material'&&!body.classList.contains('session-pending')&&!materialReady&&!loadingMaterial){body.classList.add('session-pending');loadMaterial()}}).observe(body,{attributes:true,attributeFilter:['class']});document.addEventListener('click',event=>{const app=event.target.closest('[data-app="material"]');if(!app)return;event.preventDefault();event.stopImmediatePropagation();materialReady=false;body.classList.add('session-pending');location.hash='material'},true);window.addEventListener('hashchange',()=>{materialReady=false;if(location.hash==='#material'){body.classList.add('session-pending');loadMaterial()}});installMaterialIcon();if(location.hash==='#material')body.classList.add('session-pending')})();</script><style>.home-apps [data-app="material"]{gap:16px}.home-apps [data-app="material"] .app-icon{width:48px;height:48px;flex:none;background:var(--accent);-webkit-mask:center/contain no-repeat;mask:center/contain no-repeat;filter:drop-shadow(0 0 3px var(--glow))}.home-apps [data-app="material"].locked .app-icon{filter:grayscale(1) brightness(.55)}</style>
