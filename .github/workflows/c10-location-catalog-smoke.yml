name: Publish C10 Location Catalog DEV smoke image

on:
  push:
    branches:
      - codex/telemetry-location-catalog

permissions:
  contents: read
  packages: write

concurrency:
  group: c10-location-catalog-smoke-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    if: github.repository == 'compumark/verselink' && github.ref == 'refs/heads/codex/telemetry-location-catalog'
    runs-on: ubuntu-latest
    steps:
      - name: Check out C10 Location Catalog commit
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish isolated smoke image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/compumark/verselink:c10-smoke-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/compumark/verselink
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            VERSELINK_COMMIT=${{ github.sha }}
            VERSELINK_ENVIRONMENT=DEV
            VERSELINK_VERSION=c10-smoke
