name: GitHub Issues to Discord Forum

on:
  issues:
    types: [opened, edited, labeled, unlabeled, closed, reopened]

permissions:
  contents: read
  issues: write

jobs:
  sync:
    # Never expose Discord credentials to pull-request workflows. Issue events
    # run in the base repository context.
    if: github.event.issue.pull_request == null
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: .github/scripts
          sparse-checkout-cone-mode: false
      - name: Synchronize issue to Discord forum
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_FORUM_CHANNEL_ID: ${{ secrets.DISCORD_FORUM_CHANNEL_ID }}
        run: node .github/scripts/discord-issue-sync.mjs
