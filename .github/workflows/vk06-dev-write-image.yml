name: Publish isolated VK-06 DEV write test image

on:
  push:
    branches:
      - codex/vk06-dev-orders-write-gate

permissions:
  contents: read
  packages: write

concurrency:
  group: vk06-dev-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    if: github.repository == 'compumark/verselink' && github.ref == 'refs/heads/codex/vk06-dev-orders-write-gate'
    runs-on: ubuntu-latest
    env:
      TEST_DATABASE_URL: postgres://verselink:verselink@localhost:5432/verselink_test
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: verselink_test
          POSTGRES_USER: verselink
          POSTGRES_PASSWORD: verselink
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install
      - run: npm run check
      - name: Run all tests against isolated PostgreSQL 16 (no skips)
        shell: bash
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/vk06-dev-tests.tap"
          if ! npm test -- --test-reporter=tap >"$output" 2>&1; then cat "$output"; exit 1; fi
          cat "$output"
          grep -qx '# skipped 0' "$output"

  publish:
    needs: test
    if: github.repository == 'compumark/verselink' && github.ref == 'refs/heads/codex/vk06-dev-orders-write-gate'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish immutable, branch-specific DEV candidate
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/compumark/verselink:vk06-write-dev-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/compumark/verselink
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            VERSELINK_COMMIT=${{ github.sha }}
            VERSELINK_ENVIRONMENT=DEV
            VERSELINK_VERSION=vk06-write-dev
      - name: Record immutable candidate digest
        run: |
          echo 'DEV-only candidate image: ghcr.io/compumark/verselink:vk06-write-dev-${{ github.sha }}'
          echo 'Image digest: ${{ steps.build.outputs.digest }}'
          echo 'No Portainer deployment or production tag modification is performed.'
