name: Telemetry Go

on:
  push:
    paths:
      - "telemetry/**"
      - ".github/workflows/telemetry.yml"
  pull_request:
    paths:
      - "telemetry/**"
      - ".github/workflows/telemetry.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: telemetry
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27"

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./...

      - name: Vet
        run: go vet ./...

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Verify Windows icon reproducibility
        run: |
          python -m pip install -r scripts/requirements-icon.txt
          python scripts/test_build_windows_icon.py

      - name: Verify Windows icon resource
        run: test -s cmd/verselink-telemetry-tray/rsrc_windows_amd64.syso && test -s cmd/verselink-telemetry-tray/verselink.ico

      - name: Verify Windows icon resource reproducibility
        run: |
          go run github.com/akavel/rsrc@v0.10.2 -arch amd64 -ico cmd/verselink-telemetry-tray/verselink.ico -o /tmp/rsrc_windows_amd64.syso
          cmp /tmp/rsrc_windows_amd64.syso cmd/verselink-telemetry-tray/rsrc_windows_amd64.syso

      - name: Windows cross-build
        run: go build ./...
        env:
          GOOS: windows
          GOARCH: amd64
